<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Return to Florn</title>

  <style>
    :root {
      --ivory: #fff9f2;
      --paper: #ffffff;
      --espresso-ink: #1c1712;
      --sand-grey: #8a7f70;
      --azure: #0b8ce8;
      --sky-wash: #e4f2ff;
      --border: #e4dacb;
      --error-background: #fff0ee;
      --error-text: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--ivory);
      color: var(--espresso-ink);
      font-family:
        "General Sans",
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .card {
      padding: 40px 28px 32px;
      text-align: center;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(28, 23, 18, 0.08);
    }

    .logo {
      width: 88px;
      height: 88px;
      display: block;
      object-fit: contain;
      margin: 0 auto 20px;
    }

    .status-icon {
      width: 58px;
      height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border-radius: 999px;
      background: var(--sky-wash);
      color: var(--azure);
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.45px;
    }

    p {
      color: var(--sand-grey);
      font-size: 15px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 0 24px;
      border-radius: 16px;
      background: var(--azure);
      color: var(--paper);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: var(--error-background);
      color: var(--error-text);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <img
        class="logo"
        src="florn_logo.png"
        alt="Florn logo"
      />

      <div class="status-icon" aria-hidden="true">✓</div>

      <h1>Continue to Florn</h1>

      <p>
        Your authentication is complete. Tap below to return to the app.
      </p>

      <a
        id="return-to-florn"
        class="button"
        href="florn://auth/callback"
      >
        Return to Florn
      </a>

      <p id="error-message" class="error">
        No authentication code was found. Please restart the signup flow.
      </p>
    </section>
  </main>

  <script>
    const button = document.getElementById("return-to-florn");
    const errorMessage = document.getElementById("error-message");

    const query = window.location.search;
    const hash = window.location.hash;

    button.href = `florn://auth/callback${query}${hash}`;

    if (!query && !hash) {
      errorMessage.style.display = "block";
    }
  </script>
</body>
</html>
