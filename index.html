<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Return to Florn</title>

  <style>
    :root {
      --background: #fbf8f2;
      --surface: #ffffff;
      --primary: #24483b;
      --terracotta: #b8674d;
      --text: #252525;
      --muted: #718077;
      --border: #e9ded2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 42px 30px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(36, 72, 59, 0.1);
    }

    .brand {
      margin-bottom: 28px;
      color: var(--primary);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(36, 72, 59, 0.12);
      color: var(--primary);
      font-size: 34px;
    }

    h1 {
      margin: 0 0 14px;
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }

    p {
      margin: 0 auto;
      max-width: 330px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 26px;
      padding: 15px 24px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .note {
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">FLORN</div>

    <div class="icon">✓</div>

    <h1>You're signed in</h1>

    <p>
      Your Google account has been connected successfully.
      Return to the Florn app to continue.
    </p>

    <a
      class="button"
      href="florn://auth/callback"
    >
      Return to Florn
    </a>

    <div class="note">
      If the app does not open, close this page and open Florn manually.
    </div>
  </main>
</body>
</html>
