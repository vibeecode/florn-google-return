<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Return to Florn</title>

  <style>
    :root {
      --ivory: #fff9f2;
      --paper: #ffffff;
      --espresso-ink: #1c1712;
      --sand-grey: #8a7f70;
      --azure: #0b8ce8;
      --sky-wash: #e4f2ff;
      --border: #e4dacb;
      --error-background: #fff0ee;
      --error-text: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--ivory);
      color: var(--espresso-ink);
      font-family:
        "General Sans",
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .card {
      padding: 40px 28px 32px;
      text-align: center;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(28, 23, 18, 0.08);
    }

    .logo {
      width: 88px;
      height: 88px;
      display: block;
      object-fit: contain;
      margin: 0 auto 20px;
    }

    .status-icon {
      width: 58px;
      height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border-radius: 999px;
      background: var(--sky-wash);
      color: var(--azure);
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      color: var(--espresso-ink);
      font-size: 28px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.45px;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--sand-grey);
      font-size: 15px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 0 24px;
      border: 0;
      border-radius: 16px;
      background: var(--azure);
      color: var(--paper);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition:
        filter 180ms ease,
        transform 180ms ease;
    }

    .button:hover {
      filter: brightness(0.94);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:focus-visible {
      outline: 3px solid rgba(11, 140, 232, 0.28);
      outline-offset: 3px;
    }

    .note {
      margin: 18px 0 0;
      color: var(--sand-grey);
      font-size: 12px;
      line-height: 1.4;
    }

    .error {
      display: none;
      margin: 18px 0 0;
      padding: 12px;
      border-radius: 10px;
      background: var(--error-background);
      color: var(--error-text);
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <img
        class="logo"
        src="florn_logo.png"
        alt="Florn logo"
      />

      <div class="status-icon" aria-hidden="true">✓</div>

      <h1 id="page-title">Google sign-in complete</h1>

      <p class="subtitle">
        Tap below to return to the Florn app.
      </p>

      <a
        id="return-to-florn"
        class="button"
        href="florn://auth/callback"
      >
        Return to Florn
      </a>

      <p class="note">
        If the app does not open, make sure Florn is installed on this device.
      </p>

      <p
        id="error-message"
        class="error"
        role="alert"
      >
        No authentication response was found. Please restart Google sign-in.
      </p>
    </section>
  </main>

  <script>
    const returnButton = document.getElementById("return-to-florn");
    const errorMessage = document.getElementById("error-message");

    const query = window.location.search;
    const hash = window.location.hash;

    const callbackUrl = `florn://auth/callback${query}${hash}`;

    returnButton.href = callbackUrl;

    if (!query && !hash) {
      errorMessage.style.display = "block";
    }
  </script>
</body>
</html>
